name: org-notes
title: Org Notes
base: core24
version: '0.1.607'
summary: Write, connect notes and plan your day in local Org files
description: |
  Give your ideas a place to grow, and a next step. Org Notes brings writing,
  connected notes and task planning into one local-first workspace.

  Focus on your words
  Shape drafts and notes with headings, folding outlines, lists and checkboxes.
  Use tabs and split editors to keep research beside the text you are writing.

  Connect your notes
  Link related ideas and follow backlinks to rediscover useful context.
  Find the next note with Quick Open instead of searching through folders.

  Turn ideas into action
  Capture thoughts and TODOs where they belong. Add schedules and deadlines,
  then review them together in Agenda. Keep a diary and return to your plans.

  Keep your files
  Saved notes are ordinary UTF-8 .org files in a folder you choose. Read and
  edit them without this app, or export supported content as HTML or Markdown.
  No account is required, and there is no automatic cloud synchronization.

  Before you begin:
  - This is an Org text editor, not a rich-text editor or a complete Emacs or
    GNU Org replacement. The interface is primarily English and supports
    Chinese writing. Optional Vim keys are available.
  - Save regularly and keep independent backups. Unsaved notes are not
    guaranteed to survive a restart; retained recovery files need your care.
  - Old Novel Editor works are not automatically migrated. Export and back
    them up with the old application before switching.
  - Snap permissions limit accessible locations. Removable drives require
    connecting org-notes:removable-media. Advanced external execution tools
    are not bundled, and host-installed tools are not promised to work.
  - Screen-reader access to web editor controls is currently limited in
    this Snap runtime. Keyboard and mouse editing remain available.
  - External links and optional diagram services may use the network.
license: MIT
website: https://github.com/jeasoncc/grain
source-code: https://github.com/jeasoncc/grain
issues: https://github.com/jeasoncc/grain/issues
contact: https://github.com/jeasoncc/grain/issues
icon: snap/gui/org-notes.png
grade: stable
confinement: strict

# core24 uses platforms, not the core22 architectures schema.
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

apps:
  org-notes:
    command: bin/grain
    desktop: usr/share/applications/org-notes.desktop
    extensions: [gnome]
    plugs:
      - home
      - network
      - removable-media

parts:
  org-notes:
    plugin: nil
    source: .
    # GTK3, WebKitGTK 4.1 and their runtime layout come from the core24 GNOME
    # extension's gnome-46-2404 SDK/platform, not duplicate staged GTK packages.
    build-packages:
      - build-essential
      - ca-certificates
      - curl
      - file
      - git
      - libssl-dev
      - pkg-config
      - unzip
      - xz-utils
    override-build: |
      bash "$CRAFT_PART_SRC/snap/local/build.sh"
