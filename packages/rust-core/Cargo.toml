[package]
name = "rust-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.94.0"
description = "Grain 共享核心库 - 包含所有业务逻辑、类型定义和数据库操作"
authors = ["Jeason"]

[dependencies]
# ============================================
# ORM 和数据库
# ============================================
sea-orm = { version = "2.0.4", features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
    "with-uuid",
] }

# ============================================
# 异步运行时
# ============================================
tokio = { version = "1.53.2", features = ["full"] }
async-trait = "0.1.92"

# ============================================
# 序列化
# ============================================
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# ============================================
# 错误处理
# ============================================
thiserror = "2.0.21"
anyhow = "1.0.104"

# ============================================
# 日志和追踪
# ============================================
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# ============================================
# 工具库
# ============================================
uuid = { version = "1.27.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }

# ============================================
# 文件系统
# ============================================
cap-std = "4.0.3"
libc = "0.2.190"
notify = "8.2.0"
walkdir = "2.5.0"
zip = "8.6.0"
tempfile = "3.27.0"
sha2 = "0.11.0"
hex = "0.4.3"
dirs = "7.0.0"

# ============================================
# 加密和密钥管理
# ============================================
keyring-core = "1.0.0"
base64 = "0.23.1"
rand = "0.10.3"

# ============================================
# Web 框架（用于宏生成）
# ============================================
warp = { version = "0.4.3", features = ["server"] }

# ============================================
# Tauri 框架
# ============================================
tauri = { version = "~2.12.1", features = ["unstable"] }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-fs = "2.6.0"
tauri-plugin-opener = "2.7.0"
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = "2.13.1"

[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils-keyring-store = "1.0.0"
# Keep the native handle binding aligned with Tauri/Wry; use the existing GTK context.
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

[dev-dependencies]
# ============================================
# 测试框架
# ============================================
proptest = "1.11.0"
tokio-test = "0.4.6"
warp = { version = "0.4.3", features = ["test"] }
reqwest = { version = "0.13.5", features = ["json"] }

[patch.crates-io]
# Keep standalone core builds on the same literal-data native dialog implementation.
rfd = { path = "../../patches/rfd-0.16.0" }
