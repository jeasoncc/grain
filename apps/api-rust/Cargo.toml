[package]
name = "grain-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.94.0"
description = "Grain HTTP API Server - 基于 Warp 的 REST API 服务器"
authors = ["Jeason"]

[dependencies]
# ============================================
# 共享核心库
# ============================================
rust-core = { path = "../../packages/rust-core" }

# ============================================
# Web 框架
# ============================================
warp = { version = "0.4.3", features = ["server"] }
tokio = { version = "1.53.2", features = ["full"] }

# ============================================
# 数据库
# ============================================
sea-orm = { version = "2.0.4", features = ["sqlx-sqlite", "runtime-tokio-rustls"] }

# ============================================
# 序列化
# ============================================
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# ============================================
# 日志
# ============================================
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# ============================================
# 工具库
# ============================================
uuid = { version = "1.27.0", features = ["v4", "serde"] }

[dev-dependencies]
reqwest = { version = "0.13.5", features = ["json"] }
tokio-test = "0.4.6"

[patch.crates-io]
# rust-core includes the native dialog dependency; use its pinned literal-data FFI fix.
rfd = { path = "../../patches/rfd-0.16.0" }
