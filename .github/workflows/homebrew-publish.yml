name: Publish to Homebrew

# 依赖 desktop 构建完成（需要 DMG 文件），只通过 workflow_dispatch 触发
# desktop 完成后会自动触发此工作流
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.1.53)'
        required: true
        type: string

jobs:
  publish-homebrew:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/homebrew-v}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Creating Homebrew cask for version: $VERSION"

      - name: Wait for release assets
        id: release_info
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          RELEASE_URL="https://api.github.com/repos/${{ github.repository }}/releases/tags/desktop-v$VERSION"
          
          echo "🔍 Checking release: desktop-v$VERSION"
          
          # 等待 release 和 assets（最多等待 20 分钟）
          MAX_ATTEMPTS=40
          ATTEMPT=0
          DMG_FOUND=false
          
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo ""
            echo "⏳ Attempt $ATTEMPT/$MAX_ATTEMPTS..."
            
            # 获取 release 信息
            RESPONSE=$(curl -s "$RELEASE_URL")
            
            # 检查是否找到 release
            if echo "$RESPONSE" | jq -e '.message == "Not Found"' > /dev/null 2>&1; then
              echo "⚠ Release not found yet, waiting..."
              sleep 30
              continue
            fi
            
            # 检查 assets 数量
            ASSETS_COUNT=$(echo "$RESPONSE" | jq '.assets | length // 0')
            echo "📦 Found $ASSETS_COUNT assets"
            
            if [ "$ASSETS_COUNT" -eq 0 ]; then
              echo "⚠ No assets yet, release may still be building..."
              sleep 30
              continue
            fi
            
            # 显示可用的 assets
            echo "Available assets:"
            echo "$RESPONSE" | jq -r '.assets[].name // empty'
            
            # 查找 macOS DMG 文件
            ARM_DMG=$(echo "$RESPONSE" | jq -r '[.assets[] | select(.name | test("aarch64.*\\.dmg$"; "i")) | .browser_download_url][0] // empty')
            INTEL_DMG=$(echo "$RESPONSE" | jq -r '[.assets[] | select(.name | test("x64.*\\.dmg$"; "i")) | .browser_download_url][0] // empty')
            
            if [ -n "$ARM_DMG" ]; then
              DOWNLOAD_URL="$ARM_DMG"
              ARCH="arm64"
              DMG_FOUND=true
              echo "✅ Found Apple Silicon DMG: $DOWNLOAD_URL"
              break
            elif [ -n "$INTEL_DMG" ]; then
              DOWNLOAD_URL="$INTEL_DMG"
              ARCH="intel"
              DMG_FOUND=true
              echo "✅ Found Intel DMG: $DOWNLOAD_URL"
              break
            else
              echo "⚠ No macOS DMG found yet, waiting for macOS build..."
              sleep 30
            fi
          done
          
          if [ "$DMG_FOUND" = false ]; then
            echo ""
            echo "❌ Timeout: No macOS DMG files found after $MAX_ATTEMPTS attempts"
            echo ""
            echo "📋 Possible reasons:"
            echo "1. macOS build is still in progress"
            echo "2. macOS build failed"
            echo "3. Release doesn't include macOS builds"
            echo ""
            echo "Please check the desktop release workflow and retry."
            exit 1
          fi
          
          # 下载文件计算 SHA256
          FILE_NAME=$(basename "$DOWNLOAD_URL")
          echo "📥 Downloading $FILE_NAME to calculate SHA256..."
          curl -L -o "$FILE_NAME" "$DOWNLOAD_URL"
          
          SHA256=$(shasum -a 256 "$FILE_NAME" | cut -d' ' -f1)
          rm "$FILE_NAME"
          
          echo "✅ SHA256: $SHA256"
          
          # 输出变量
          echo "download_url=$DOWNLOAD_URL" >> $GITHUB_OUTPUT
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "arch=$ARCH" >> $GITHUB_OUTPUT
          echo "file_name=$FILE_NAME" >> $GITHUB_OUTPUT

      - name: Create Homebrew Cask
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DOWNLOAD_URL="${{ steps.release_info.outputs.download_url }}"
          SHA256="${{ steps.release_info.outputs.sha256 }}"
          ARCH="${{ steps.release_info.outputs.arch }}"
          
          # 创建 cask 目录
          mkdir -p homebrew-cask
          
          # 创建 Cask 文件
          cat > homebrew-cask/grain.rb << EOF
          cask "grain" do
            version "$VERSION"
            sha256 "$SHA256"
          
            url "https://github.com/${{ github.repository }}/releases/download/desktop-v#{version}/grain_#{version}_aarch64.dmg",
                verified: "github.com/${{ github.repository }}/"
            name "Grain"
            desc "Modern, powerful novel writing application for serious writers"
            homepage "https://github.com/${{ github.repository }}"
          
            livecheck do
              url :url
              regex(/desktop-v?(\d+(?:\.\d+)+)/i)
            end
          
            app "grain.app"
          
            zap trash: [
              "~/Library/Application Support/com.lotus.grain",
              "~/Library/Caches/com.lotus.grain",
              "~/Library/Preferences/com.lotus.grain.plist",
              "~/Library/Saved Application State/com.lotus.grain.savedState",
              "~/Library/WebKit/com.lotus.grain",
            ]
          end
          EOF
          
          echo "✅ Homebrew Cask created"
          echo ""
          echo "📄 Cask content:"
          cat homebrew-cask/grain.rb

      - name: Install Homebrew and test cask
        run: |
          echo "🧪 Testing Homebrew cask..."
          
          # 确保 Homebrew 已安装
          if ! command -v brew &> /dev/null; then
            echo "Installing Homebrew..."
            /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi
          
          # 验证 cask 语法（使用新的命令格式）
          echo "Validating cask syntax..."
          brew style --cask homebrew-cask/grain.rb || echo "Style check completed (warnings are acceptable)"
          
          # 验证 Ruby 语法
          ruby -c homebrew-cask/grain.rb
          
          echo "✅ Cask syntax validation passed"

      - name: Create PR to Homebrew Cask repository
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          
          echo "🍺 Preparing Homebrew Cask submission..."
          
          # 配置 git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 克隆 homebrew-cask 仓库
          echo "📥 Cloning homebrew-cask repository..."
          git clone https://github.com/Homebrew/homebrew-cask.git
          cd homebrew-cask
          
          # 创建新分支
          BRANCH_NAME="grain-$VERSION"
          git checkout -b "$BRANCH_NAME"
          
          # 复制 cask 文件
          cp ../homebrew-cask/grain.rb Casks/n/grain.rb
          
          # 提交更改
          git add Casks/n/grain.rb
          git commit -m "Add grain $VERSION"
          
          echo "✅ Prepared Homebrew Cask update"
          echo ""
          echo "📋 Next steps (manual):"
          echo "1. Fork https://github.com/Homebrew/homebrew-cask"
          echo "2. Add the cask file to Casks/n/ directory"
          echo "3. Create PR with title: 'Add grain $VERSION'"
          echo ""
          echo "📄 Cask file ready in artifacts"

      - name: Upload Homebrew Cask artifact
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-cask
          path: "homebrew-cask/grain.rb"
          retention-days: 30

      - name: Create success summary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCH="${{ steps.release_info.outputs.arch }}"
          
          echo ""
          echo "🎉 Homebrew Cask Summary"
          echo "========================"
          echo "✅ Version: $VERSION"
          echo "✅ Architecture: $ARCH"
          echo "✅ Cask: grain.rb"
          echo "✅ SHA256 verified"
          echo ""
          echo "📦 Installation command (after approval):"
          echo "   brew install --cask grain"
          echo ""
          echo "🔗 Repository:"
          echo "   https://github.com/Homebrew/homebrew-cask"
          echo ""
          echo "📋 Manual submission:"
          echo "1. Download cask from artifacts"
          echo "2. Fork Homebrew/homebrew-cask"
          echo "3. Add to Casks/n/ directory"
          echo "4. Create PR"