name: Publish to AUR

# 依赖 desktop 构建完成，只通过 workflow_dispatch 触发
# 仅可手动运行；发布前必须确认渠道包名、维护权限与安装包归属。
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.1.33)'
        required: true
        type: string

jobs:
  publish-aur:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Extract version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Publishing version: $VERSION"
      
      - name: Verify release exists
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "🔍 Checking if release desktop-v$VERSION exists..."
          
          # 检查 GitHub release 是否存在 (使用 desktop-v 前缀)
          if ! curl -s -f "https://api.github.com/repos/${{ github.repository }}/releases/tags/desktop-v$VERSION" > /dev/null; then
            echo "❌ Release desktop-v$VERSION not found. Please create a GitHub release first."
            echo "💡 Expected release tag: desktop-v$VERSION"
            exit 1
          fi
          
          echo "✅ Release desktop-v$VERSION found"
      
      - name: Update PKGBUILD
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "📝 Updating PKGBUILD to version $VERSION"
          
          # 更新版本号
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" aur/PKGBUILD
          
          # 更新 source URL
          sed -i "s|archive/refs/tags/desktop-v.*\.tar\.gz|archive/refs/tags/desktop-v$VERSION.tar.gz|" aur/PKGBUILD
          
          # 显示更新后的内容
          echo "📄 Updated PKGBUILD:"
          grep -E "^(pkgver|source)" aur/PKGBUILD
      
      - name: Generate .SRCINFO using Docker
        run: |
          cd aur
          echo "🔨 Generating .SRCINFO using Arch Linux container..."
          
          # 使用 Arch Linux Docker 容器生成 .SRCINFO
          docker run --rm -v "$(pwd):/workspace" -w /workspace archlinux:latest bash -c "
            pacman -Sy --noconfirm base-devel
            useradd -m builder
            chown -R builder:builder /workspace
            su builder -c 'makepkg --printsrcinfo > .SRCINFO'
          "
          
          echo "📄 Generated .SRCINFO:"
          cat .SRCINFO
      
      - name: Validate PKGBUILD
        run: |
          cd aur
          echo "✅ Validating PKGBUILD..."
          
          # 检查 PKGBUILD 语法
          bash -n PKGBUILD
          
          # 使用 Docker 验证 PKGBUILD
          docker run --rm -v "$(pwd):/workspace" -w /workspace archlinux:latest bash -c "
            source PKGBUILD
            if [ -z \"\$pkgname\" ] || [ -z \"\$pkgver\" ] || [ -z \"\$pkgdesc\" ]; then
              echo '❌ PKGBUILD missing required fields'
              exit 1
            fi
            echo '✅ PKGBUILD validation passed'
          "
      
      - name: Check AUR credentials
        run: |
          if [ -z "${{ secrets.AUR_USERNAME }}" ] || [ -z "${{ secrets.AUR_EMAIL }}" ] || [ -z "${{ secrets.AUR_SSH_PRIVATE_KEY }}" ]; then
            echo "❌ Missing AUR credentials. Please set AUR_USERNAME, AUR_EMAIL, and AUR_SSH_PRIVATE_KEY secrets."
            exit 1
          fi
          echo "✅ AUR credentials found"
      
      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v2.7.2
        with:
          pkgname: grain
          pkgbuild: aur/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update grain to version ${{ steps.version.outputs.version }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519
          force_push: true
      
      - name: Create success comment
        if: success() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.version.outputs.version }}';
            
            try {
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                body: `🎉 **AUR 发布成功！**
            
            **版本：** ${version}
            **包名：** grain
            
            **安装命令：**
            \`\`\`bash
            yay -S grain
            # 或
            paru -S grain
            \`\`\`
            
            **AUR 页面：** https://aur.archlinux.org/packages/grain`
              });
            } catch (error) {
              console.log('无法创建评论，但 AUR 发布成功:', error.message);
            }
