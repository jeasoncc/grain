name: Publish AUR Binary Package

# 依赖 desktop 构建完成（需要 DEB 文件），只通过 workflow_dispatch 触发
# 仅可手动运行；发布前必须确认渠道包名、维护权限与安装包归属。
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.1.33)'
        required: true
        type: string

jobs:
  publish-aur-bin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Extract version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Publishing binary version: $VERSION"
      
      - name: Verify release and DEB file exist
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "🔍 Checking if release desktop-v$VERSION exists..."
          
          # 检查 GitHub release 是否存在
          if ! curl -s -f "https://api.github.com/repos/${{ github.repository }}/releases/tags/desktop-v$VERSION" > /dev/null; then
            echo "❌ Release desktop-v$VERSION not found. Please create a GitHub release first."
            exit 1
          fi
          
          # 检查 DEB 文件是否存在
          DEB_URL="https://github.com/${{ github.repository }}/releases/download/desktop-v$VERSION/grain_${VERSION}_amd64.deb"
          echo "🔍 Checking DEB file: $DEB_URL"
          if ! curl -s -f -I "$DEB_URL" > /dev/null; then
            echo "❌ DEB file not found: $DEB_URL"
            exit 1
          fi
          
          echo "✅ Release desktop-v$VERSION and DEB file found"
      
      - name: Prepare binary PKGBUILD
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd aur
          echo "📝 Preparing binary PKGBUILD for version $VERSION"
          
          # 复制 PKGBUILD-bin 为 PKGBUILD (保持源文件不变)
          cp PKGBUILD-bin PKGBUILD
          
          # 更新版本号
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" PKGBUILD
          
          # 更新 source URL
          sed -i "s|desktop-v.*\/grain_.*_amd64\.deb|desktop-v$VERSION/grain_${VERSION}_amd64.deb|" PKGBUILD
          
          # 显示更新后的内容
          echo "📄 Updated PKGBUILD:"
          grep -E "^(pkgver|source)" PKGBUILD
      
      - name: Generate .SRCINFO using Docker
        run: |
          cd aur
          echo "🔨 Generating .SRCINFO using Arch Linux container..."
          
          # 使用 Arch Linux Docker 容器生成 .SRCINFO
          docker run --rm -v "$(pwd):/workspace" -w /workspace archlinux:latest bash -c "
            pacman -Sy --noconfirm base-devel
            useradd -m builder
            chown -R builder:builder /workspace
            su builder -c 'makepkg --printsrcinfo > .SRCINFO'
          "
          
          echo "📄 Generated .SRCINFO:"
          cat .SRCINFO
      
      - name: Test DEB extraction
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "🧪 Testing DEB file extraction..."
          
          # 下载 DEB 文件进行测试
          DEB_URL="https://github.com/${{ github.repository }}/releases/download/desktop-v$VERSION/grain_${VERSION}_amd64.deb"
          curl -L -o test.deb "$DEB_URL"
          
          # 检查 DEB 包内容
          echo "📦 DEB package contents:"
          ar t test.deb
          
          # 提取并检查数据文件格式
          ar x test.deb
          if [ -f data.tar.xz ]; then
            echo "✅ Found data.tar.xz"
          elif [ -f data.tar.gz ]; then
            echo "✅ Found data.tar.gz"
          elif [ -f data.tar.zst ]; then
            echo "✅ Found data.tar.zst"
          else
            echo "❌ No supported data archive found"
            ls -la
            exit 1
          fi
          
          # 清理测试文件
          rm -f test.deb control.tar.* data.tar.* debian-binary
      
      - name: Validate PKGBUILD
        run: |
          cd aur
          echo "✅ Validating PKGBUILD..."
          
          # 检查 PKGBUILD 语法
          bash -n PKGBUILD
          
          # 使用 Docker 验证 PKGBUILD
          docker run --rm -v "$(pwd):/workspace" -w /workspace archlinux:latest bash -c "
            source PKGBUILD
            if [ -z \"\$pkgname\" ] || [ -z \"\$pkgver\" ] || [ -z \"\$pkgdesc\" ]; then
              echo '❌ PKGBUILD missing required fields'
              exit 1
            fi
            echo '✅ PKGBUILD validation passed'
          "
      
      - name: Check AUR credentials
        run: |
          if [ -z "${{ secrets.AUR_USERNAME }}" ] || [ -z "${{ secrets.AUR_EMAIL }}" ] || [ -z "${{ secrets.AUR_SSH_PRIVATE_KEY }}" ]; then
            echo "❌ Missing AUR credentials. Please set AUR_USERNAME, AUR_EMAIL, and AUR_SSH_PRIVATE_KEY secrets."
            exit 1
          fi
          echo "✅ AUR credentials found"
      
      - name: Publish to AUR (Binary Package)
        uses: KSXGitHub/github-actions-deploy-aur@v2.7.2
        with:
          pkgname: grain-bin
          pkgbuild: aur/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update grain-bin to version ${{ steps.version.outputs.version }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519
          force_push: true
      
      - name: Create success comment
        if: success() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.version.outputs.version }}';
            
            try {
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                body: `🎉 **AUR 二进制包发布成功！**
            
            **版本：** ${version}
            **包名：** grain-bin
            
            **安装命令（快速安装，无需编译）：**
            \`\`\`bash
            yay -S grain-bin
            # 或
            paru -S grain-bin
            \`\`\`
            
            **优势：**
            - ✅ 快速安装（直接使用预编译的 DEB 包）
            - ✅ 无需构建依赖（Rust、Bun 等）
            - ✅ 安装包只有 ~6MB
            
            **AUR 页面：** https://aur.archlinux.org/packages/grain-bin`
              });
            } catch (error) {
              console.log('无法创建评论，但 AUR 二进制包发布成功:', error.message);
            }