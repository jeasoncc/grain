name: Publish to Flathub

# 依赖 desktop 构建完成，只通过 workflow_dispatch 触发
# 仅可手动运行；发布前必须确认渠道包名、维护权限与安装包归属。
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.1.36)'
        required: true
        type: string

jobs:
  publish-flatpak:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Extract version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Publishing version: $VERSION"
      
      - name: Verify release exists
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "🔍 Checking if release desktop-v$VERSION exists..."
          
          # 检查 GitHub release 是否存在
          if ! curl -s -f "https://api.github.com/repos/${{ github.repository }}/releases/tags/desktop-v$VERSION" > /dev/null; then
            echo "❌ Release desktop-v$VERSION not found."
            echo ""
            echo "📋 To fix this issue:"
            echo "1. Run the desktop release workflow first:"
            echo "   npm run tag:desktop"
            echo "   # or manually: git tag desktop-v$VERSION && git push origin desktop-v$VERSION"
            echo ""
            echo "2. Wait for desktop build to complete"
            echo ""
            echo "3. Then retry this Flatpak workflow"
            exit 1
          fi
          
          echo "✅ Release desktop-v$VERSION found"
      
      - name: Update Flatpak manifest
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "📝 Updating Flatpak manifest to version $VERSION"
          
          # 更新 metainfo 中的版本
          sed -i "s/<release version=\".*\"/<release version=\"$VERSION\"/" flatpak/com.lotus.Grain.metainfo.xml
          sed -i "s/date=\".*\"/date=\"$(date +%Y-%m-%d)\"/" flatpak/com.lotus.Grain.metainfo.xml
          
          echo "📄 Flatpak manifest (using local source):"
          cat flatpak/com.lotus.Grain.yml | tail -10
      
      - name: Install Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          
          # 添加 flathub remote（系统级和用户级）
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
      
      - name: Install Flatpak SDK
        run: |
          # 安装到用户空间（与 flatpak-builder --user 匹配）
          flatpak install --user -y flathub org.freedesktop.Platform//25.08
          flatpak install --user -y flathub org.freedesktop.Sdk//25.08
          flatpak install --user -y flathub org.freedesktop.Sdk.Extension.node24//25.08
          flatpak install --user -y flathub org.freedesktop.Sdk.Extension.rust-stable//25.08

      - name: Setup Node LTS
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: '1.4.2'

      - name: Pre-install dependencies with Bun
        run: |
          echo "📦 Pre-installing dependencies with Bun..."
          # 在 workflow 中用 Bun 安装依赖（有网络）
          # 这样 Flatpak 沙箱构建时就不需要网络了
          bun install --frozen-lockfile
          
          echo "✅ Dependencies installed"
          echo "node_modules size: $(du -sh node_modules | cut -f1)"
      
      - name: Build Flatpak
        run: |
          echo "🔨 Building Flatpak package..."
          
          # 创建构建目录
          mkdir -p build-dir repo
          
          # 构建 Flatpak（使用用户级 flathub remote，禁用沙箱以允许网络访问安装 bun）
          flatpak-builder --force-clean --disable-rofiles-fuse --user --install-deps-from=flathub \
            --repo=repo build-dir flatpak/com.lotus.Grain.yml
          
          # 导出为 .flatpak 文件
          flatpak build-bundle repo grain-${{ steps.version.outputs.version }}.flatpak \
            com.lotus.Grain
          
          echo "✅ Flatpak built successfully"
          ls -la *.flatpak
      
      - name: Test Flatpak installation
        run: |
          echo "🧪 Testing Flatpak installation..."
          
          # 安装测试
          flatpak install --user -y grain-${{ steps.version.outputs.version }}.flatpak
          
          # 验证安装
          if flatpak list --user | grep -q com.lotus.Grain; then
            echo "✅ Flatpak installation test passed"
          else
            echo "❌ Flatpak installation test failed"
            exit 1
          fi
      
      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-package
          path: "*.flatpak"
          retention-days: 30
      
      - name: Create Flathub PR preparation
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "📋 Flatpak package ready for Flathub submission!"
          echo ""
          echo "Next steps to publish on Flathub:"
          echo "1. Fork https://github.com/flathub/flathub"
          echo "2. Create a new repository: https://github.com/flathub/com.lotus.Grain"
          echo "3. Copy flatpak/com.lotus.Grain.yml to the new repo"
          echo "4. Submit PR to flathub/flathub with the new app"
          echo ""
          echo "Files ready for submission:"
          echo "- flatpak/com.lotus.Grain.yml"
          echo "- flatpak/com.lotus.Grain.desktop"
          echo "- flatpak/com.lotus.Grain.metainfo.xml"
      
      - name: Create success comment
        if: success() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.version.outputs.version }}';
            
            try {
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                body: `🎉 **Flatpak 构建成功！**
            
            **版本：** ${version}
            **包名：** com.lotus.Grain
            
            **下载：** 查看 Actions artifacts
            
            **下一步：** 提交到 Flathub
            1. Fork https://github.com/flathub/flathub
            2. 创建新仓库：com.lotus.Grain
            3. 提交 PR 到 Flathub
            
            **安装命令（发布后）：**
            \`\`\`bash
            flatpak install flathub com.lotus.Grain
            \`\`\``
              });
            } catch (error) {
              console.log('无法创建评论，但 Flatpak 构建成功:', error.message);
            }