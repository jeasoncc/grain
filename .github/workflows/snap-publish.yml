name: Publish to Snap Store

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Snap channel to publish to'
        required: true
        default: 'edge'
        type: choice
        options:
          - edge
          - beta
          - candidate
          - stable
  push:
    tags:
      - 'snap-v*.*.*'   # 仅在打 snap tag 时触发 (snap-v0.1.7)

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Snapcraft
        run: |
          sudo snap install snapcraft --classic
      
      - name: Build Snap
        uses: snapcore/action-build@v1
        id: build
      
      - name: Extract version and determine channel
        id: version_channel
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "channel=${{ github.event.inputs.channel }}" >> $GITHUB_OUTPUT
            # 从 package.json 读取版本号
            VERSION=$(grep -o '"version":\s*"[^"]*"' package.json | sed 's/.*"version":\s*"\([^"]*\)".*/\1/')
          else
            # 从 tag 提取版本号 (snap-v0.1.47 -> 0.1.47)
            VERSION=${GITHUB_REF#refs/tags/snap-v}
            echo "channel=edge" >> $GITHUB_OUTPUT
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION"
          
          # 更新 snapcraft.yaml 中的版本号
          sed -i "s/^version: .*/version: '$VERSION'/" snap/snapcraft.yaml
          echo "✅ Updated snapcraft.yaml version to $VERSION"
      
      - name: Publish to Snap Store
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_TOKEN }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: ${{ steps.channel.outputs.channel }}
      
      - name: Upload snap artifact
        uses: actions/upload-artifact@v6
        with:
          name: snap-package
          path: ${{ steps.build.outputs.snap }}
      
      - name: Create release comment
        if: github.event_name == 'push'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const channel = '${{ steps.version_channel.outputs.channel }}';
            const version = '${{ steps.version_channel.outputs.version }}';
            const tag = context.ref.replace('refs/tags/', '');
            
            try {
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                body: `🎉 **Snap 发布成功！**
            
            **频道：** ${channel}
            **版本：** ${version}
            
            **安装命令：**
            \`\`\`bash
            sudo snap install grain --${channel}
            \`\`\`
            
            **查看详情：** https://snapcraft.io/grain`
              });
            } catch (error) {
              console.log('无法创建评论，但 Snap 发布成功:', error.message);
            }
