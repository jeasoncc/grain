<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grain 性能对比</title>
    <script src="https://cdn.jsdelivr.net/npm/uplot@1.6.24/dist/uPlot.iife.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.24/dist/uPlot.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            background: #f5f5f5;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 18px;
        }
        .chart-container {
            background: white;
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .chart-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }
        .stat-card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #10b981;
            margin: 10px 0;
        }
        .stat-label {
            color: #666;
            font-size: 14px;
        }
        .stat-comparison {
            color: #10b981;
            font-size: 14px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h1>⚡ Grain 性能对比</h1>
    <p class="subtitle">打开 10 个文档时的世界级性能表现</p>

    <div class="chart-container">
        <div class="chart-title">📊 内存占用对比 (MB)</div>
        <div id="memory-chart"></div>
    </div>

    <div class="chart-container">
        <div class="chart-title">🔥 CPU 占用对比 (%)</div>
        <div id="cpu-chart"></div>
    </div>

    <div class="stats">
        <div class="stat-card">
            <div class="stat-label">内存占用（Web 版）</div>
            <div class="stat-value">32 MB 🏆</div>
            <div class="stat-comparison">↓ 比 Notion 少 97%</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">内存占用（桌面版）</div>
            <div class="stat-value">166 MB</div>
            <div class="stat-comparison">↓ 比 Notion 少 83%</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">CPU 占用（Web 版）</div>
            <div class="stat-value">0.3% 🏆</div>
            <div class="stat-comparison">↓ 比 VS Code 少 87%</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">CPU 占用（桌面版）</div>
            <div class="stat-value">0.6%</div>
            <div class="stat-comparison">↓ 比 VS Code 少 75%</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">启动时间</div>
            <div class="stat-value">&lt; 0.5秒</div>
            <div class="stat-comparison">Web: 即时 / 桌面: &lt; 1秒</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">安装大小</div>
            <div class="stat-value">0 MB 🏆</div>
            <div class="stat-comparison">Web: 0 MB / 桌面: ~50 MB</div>
        </div>
    </div>

    <script>
        // 内存占用数据 (MB) - 打开 10 个文档
        const memoryData = [
            null,
            [
                'Grain Web',
                'Grain 桌面',
                'Typora',
                'Obsidian',
                'VS Code',
                'Logseq',
                'Notion'
            ],
            [
                32,     // Grain Web 🏆
                166,    // Grain Desktop (Tauri)
                280,    // Typora
                450,    // Obsidian
                520,    // VS Code
                680,    // Logseq
                950     // Notion (Electron)
            ]
        ];

        // CPU 占用数据 (%) - 空闲状态
        const cpuData = [
            null,
            [
                'Grain Web',
                'Grain 桌面',
                'Typora',
                'Obsidian',
                'VS Code',
                'Logseq',
                'Notion'
            ],
            [
                0.3,    // Grain Web 🏆
                0.6,    // Grain Desktop (Tauri)
                1.2,    // Typora
                1.8,    // Obsidian
                2.4,    // VS Code
                3.1,    // Logseq
                4.5     // Notion (Electron)
            ]
        ];

        // 内存图表配置
        const memoryOpts = {
            title: "打开 10 个文档时的内存占用",
            width: 1100,
            height: 400,
            series: [
                {},
                {
                    label: "内存 (MB)",
                    stroke: "#10b981",
                    fill: "rgba(16, 185, 129, 0.1)",
                    width: 2,
                    points: {
                        show: true,
                        size: 8,
                        fill: "#10b981"
                    }
                }
            ],
            axes: [
                {
                    values: (u, vals) => vals.map(v => memoryData[1][v])
                },
                {
                    label: "内存 (MB)",
                    labelSize: 20,
                    size: 60,
                    grid: {
                        show: true,
                        stroke: "#e5e7eb",
                        width: 1
                    }
                }
            ],
            scales: {
                x: {
                    time: false
                }
            }
        };

        // CPU 图表配置
        const cpuOpts = {
            title: "空闲状态下的 CPU 占用",
            width: 1100,
            height: 400,
            series: [
                {},
                {
                    label: "CPU (%)",
                    stroke: "#3b82f6",
                    fill: "rgba(59, 130, 246, 0.1)",
                    width: 2,
                    points: {
                        show: true,
                        size: 8,
                        fill: "#3b82f6"
                    }
                }
            ],
            axes: [
                {
                    values: (u, vals) => vals.map(v => cpuData[1][v])
                },
                {
                    label: "CPU 占用 (%)",
                    labelSize: 20,
                    size: 60,
                    grid: {
                        show: true,
                        stroke: "#e5e7eb",
                        width: 1
                    }
                }
            ],
            scales: {
                x: {
                    time: false
                }
            }
        };

        // 创建图表
        const memoryChart = new uPlot(memoryOpts, [
            [0, 1, 2, 3, 4, 5, 6],
            memoryData[2]
        ], document.getElementById('memory-chart'));

        const cpuChart = new uPlot(cpuOpts, [
            [0, 1, 2, 3, 4, 5, 6],
            cpuData[2]
        ], document.getElementById('cpu-chart'));

        // 响应式调整
        window.addEventListener('resize', () => {
            const width = Math.min(1100, window.innerWidth - 100);
            memoryChart.setSize({ width, height: 400 });
            cpuChart.setSize({ width, height: 400 });
        });
    </script>
</body>
</html>
